<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!--
      Strict CSP. Egress is restricted to WarcraftLogs. Even if an XSS slipped
      in, exfiltrating the user's API key to a third-party origin would be
      blocked by the browser.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https://*.warcraftlogs.com https://gist.githubusercontent.com https://*.githubusercontent.com;
        img-src 'self' data: https://*.warcraftlogs.com;
        font-src 'self';
        object-src 'none';
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <title>Role Performance Breakdown</title>
  </head>
  <body class="h-full bg-zinc-950 text-zinc-100 antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
